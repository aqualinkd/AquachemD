name: Compile Release Assets

on:
#  push:
#    branches: [ main ]
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'The existing tag/release name (e.g., v0.1.0) to compile for and upload assets to.'
        type: string
        required: true
        
  workflow_run:
    workflows: ["Publish Production Release"]
    types:
      - completed

permissions:
  contents: write

jobs:
  init:
    name: Resolve Target Reference
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.determine_tag.outputs.tag }}
    steps:
      # If chained from a release run, pull the version directly from the shared artifact token
      - name: Download Upstream Tag Token
        if: ${{ github.event_name == 'workflow_run' }}
        uses: actions/download-artifact@v4
        with:
          name: upstream-release-tag
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          path: .

      - name: Determine Target Tag
        id: determine_tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TARGET_TAG="${{ github.event.inputs.tag_name }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            TARGET_TAG="${{ github.ref_name }}"
          else
            TARGET_TAG=$(cat release_tag.txt)
          fi
          
          echo "---------------------------------"
          echo "Workflow Event: ${{ github.event_name }}"
          echo "Target Release Tag: $TARGET_TAG"
          echo "---------------------------------"
          echo "tag=$TARGET_TAG" >> $GITHUB_OUTPUT

  build:
    name: Compile Binaries
    needs: init
    runs-on: ubuntu-latest 
    container:
      image: debian:trixie 
    steps:
      - name: Checkout Target Code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.init.outputs.release_tag }}
      
      - name: Setup build environment for ARM64 and ARMHF
        run: |
          dpkg --add-architecture armhf 
          dpkg --add-architecture arm64
          apt-get update -y
          apt-get install -y \
            build-essential \
            crossbuild-essential-armhf \
            crossbuild-essential-arm64 \
            libsystemd-dev \
            libsystemd-dev:arm64 \
            libsystemd-dev:armhf \
            libgpiod-dev \
            libgpiod-dev:arm64 \
            libgpiod-dev:armhf
          
      - name: Compile AquachemD Architectures
        run: |
          make clean
          make all arm64 armhf

      - name: Create release archive
        run: tar -czvf AquachemD-release.tar.gz web/ release/

      - name: Save Archive for Deployment
        uses: actions/upload-artifact@v4
        with:
          name: aquachemd-binaries
          path: AquachemD-release.tar.gz
          retention-days: 1

  deploy:
    name: Publish assets to GitHub Release
    needs: [init, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download Compiled Binaries
        uses: actions/download-artifact@v4
        with:
          name: aquachemd-binaries

      - name: Update GitHub Release and Upload Artifact
        uses: softprops/action-gh-release@v2 
        with:
          tag_name: ${{ needs.init.outputs.release_tag }} 
          name: Release ${{ needs.init.outputs.release_tag }}
          draft: false
          overwrite: true
          files: AquachemD-release.tar.gz
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  

  