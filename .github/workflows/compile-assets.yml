name: Compile Release Assets

on:
  push:
    branches: [ main ]
    tags:
      - 'v*.*.*'
  workflow_dispatch: # Allows manual run fallback
    inputs:
      tag_name:
        description: 'The existing tag/release name (e.g., v0.1.0) to compile for and upload assets to.'
        type: string
        required: true
        
  # Automatically chain when the Publish Production Release workflow creation finishes
  workflow_run:
    workflows: ["Publish Production Release"]
    types:
      - completed

permissions:
  contents: write

jobs:
  build:
    name: Compile Binaries
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest 
    container:
      image: debian:trixie 
    
    outputs:
      release_tag: ${{ steps.determine_tag.outputs.tag }}
      
    steps:
      - name: Determine Target Tag
        id: determine_tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TARGET_TAG="${{ github.event.inputs.tag_name }}"
            echo "Context: Manual execution."
          elif [ "${{ github.event_name }}" = "push" ]; then
            TARGET_TAG="${{ github.ref_name }}"
            echo "Context: Direct Git push/tag event."
          else
            # Context: Triggered by workflow_run
            # We look at the trigger event's commit metadata or the tags array if available.
            # To be 100% foolproof, we parse the tag name using the GitHub context log tracking:
            echo "Context: Chained from completed workflow."
            
            # If the upstream workflow was tracking a tag, grab it; otherwise, read the commit SHA
            # to fetch the exact tag associated with it.
            # But since we know publish-release creates a tag formatted like 'v*.*.*' based on the header file,
            # we can look up the tag associated with the commit SHA that just ran:
            TARGET_TAG=$(git env | grep -o 'v[0-9]\+\.[0-9]\+\.[0-9]\+' || echo "")
            
            # Bulletproof fallback: Fetch the latest tag on the repository commit context
            if [ -z "$TARGET_TAG" ]; then
               # Quick clone check to read the reference tag name of the triggering commit
               apt-get update && apt-get install -y curl jq
               URL="https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}"
               # Request the API details of the run that triggered us to see its release/tag details
               TARGET_TAG=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" $URL | jq -r '.target_commitish // empty')
               
               # If API target_commitish isn't the tag, fall back to extracting it from the header file directly 
               # just like publish-release did, ensuring they match perfectly!
               if [ -z "$TARGET_TAG" ] || [ "$TARGET_TAG" = "main" ]; then
                 VERSION_LINE=$(grep '#define AQUACHEMD_VERSION' source/version.h || echo "0.0.0")
                 CLEAN_VER=$(echo "$VERSION_LINE" | sed -E 's/.*"([^"]+)".*/\1/')
                 TARGET_TAG="v$CLEAN_VER"
               fi
            fi
          fi
          
          echo "---------------------------------"
          echo "Workflow Event: ${{ github.event_name }}"
          echo "Determined Release Target Tag: $TARGET_TAG"
          echo "---------------------------------"
          echo "tag=$TARGET_TAG" >> $GITHUB_OUTPUT

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.determine_tag.outputs.tag }}
      
      - name: Setup build environment for ARM64 and ARMHF
        run: |
          dpkg --add-architecture armhf 
          dpkg --add-architecture arm64
          apt-get update -y
          apt-get install -y \
            build-essential \
            crossbuild-essential-armhf \
            crossbuild-essential-arm64 \
            libsystemd-dev \
            libsystemd-dev:arm64 \
            libsystemd-dev:armhf \
            libgpiod-dev \
            libgpiod-dev:arm64 \
            libgpiod-dev:armhf
          
      - name: Compile AquachemD Architectures
        run: |
          make clean
          make all arm64 armhf

      - name: Create release archive
        run: tar -czvf AquachemD-release.tar.gz web/ release/

      - name: Save Archive for Deployment
        uses: actions/upload-artifact@v4
        with:
          name: aquachemd-binaries
          path: AquachemD-release.tar.gz
          retention-days: 1

  deploy:
    name: Publish Assets to GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Compiled Binaries
        uses: actions/download-artifact@v4
        with:
          name: aquachemd-binaries

      - name: Update GitHub Release and Upload Artifact
        uses: softprops/action-gh-release@v2 
        with:
          tag_name: ${{ needs.build.outputs.release_tag }} 
          name: Release ${{ needs.build.outputs.release_tag }}
          draft: false
          overwrite: true
          files: AquachemD-release.tar.gz
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  