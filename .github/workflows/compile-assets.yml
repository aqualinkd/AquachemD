name: AquachemD build Workflow

on:
  workflow_dispatch: # Allow manual run

# Grant explicit permissions to create tags/releases and write assets
permissions:
  contents: write

jobs:
  build:
    name: Compile Binaries
    runs-on: ubuntu-latest 
    container:
      image: debian:trixie 
      
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup build environment for ARM64 and ARMHF
        run: |
          dpkg --add-architecture armhf 
          dpkg --add-architecture arm64
          apt-get update -y
          apt-get install -y \
            build-essential \
            crossbuild-essential-armhf \
            crossbuild-essential-arm64 \
            libsystemd-dev \
            libsystemd-dev:arm64 \
            libsystemd-dev:armhf \
            libgpiod-dev \
            libgpiod-dev:arm64 \
            libgpiod-dev:armhf
          
      - name: Compile AquachemD Architectures
        # Changed to compile native, arm64, and armhf so all targets generate
        run: |
          make clean
          make all arm64 armhf

      - name: Create release archive
        run: tar -czvf AquachemD-release.tar.gz web/ release/

      - name: Save Archive for Deployment
        uses: actions/upload-artifact@v4
        with:
          name: aquachemd-binaries
          path: AquachemD-release.tar.gz
          retention-days: 1

  deploy:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Compiled Binaries
        uses: actions/download-artifact@v4
        with:
          name: aquachemd-binaries

      # --- Create/Update the Development Release ---
      - name: Create or Update GitHub Draft Release
        if: ${{ (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')) || github.event_name == 'workflow_dispatch' }}
        uses: softprops/action-gh-release@v2 
        with:
          files: AquachemD-release.tar.gz
          overwrite: true
          tag_name: development-latest 
          name: Development Build (Latest Main/Manual)
          draft: true
          fail_on_unmatched_files: true # Force failures if the asset goes missing
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # --- Create the Formal Versioned Release ---
      - name: Create Final GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v2 
        with:
          files: AquachemD-release.tar.gz
          overwrite: true
          tag_name: ${{ github.ref_name }}
          name: AquachemD Release ${{ github.ref_name }}
          draft: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}