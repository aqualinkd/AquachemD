name: Compile Release Assets

on:
  push:
    branches: [ main ]
    tags:
      - 'v*.*.*'
  workflow_dispatch: # Allows manual run fallback
    inputs:
      tag_name:
        description: 'The existing tag/release name (e.g., v0.1.0) to compile for and upload assets to.'
        type: string
        required: true
        
  # Automatically chain when the Publish Production Release workflow (publish-release.yml) creation finishes
  workflow_run:
    workflows: ["Publish Production Release"]
    types:
      - completed

permissions:
  contents: write

jobs:
  build:
    name: Compile Binaries
    # Only run if the triggering workflow succeeded, or if it was a push/manual event
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest 
    container:
      image: debian:trixie 
    
    outputs:
      release_tag: ${{ steps.determine_tag.outputs.tag }}
      
    steps:
      # Determine the tag dynamically based on the event context
      - name: Determine Target Tag
        id: determine_tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            # Extracts tag from the workflow_run context
            RAW_REF="${{ github.event.workflow_run.head_branch }}"
            CLEAN_TAG=$(echo "$RAW_REF" | sed 's|refs/tags/||')
            echo "tag=$CLEAN_TAG" >> $GITHUB_OUTPUT
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.determine_tag.outputs.tag }}
      
      - name: Setup build environment for ARM64 and ARMHF
        run: |
          dpkg --add-architecture armhf 
          dpkg --add-architecture arm64
          apt-get update -y
          apt-get install -y \
            build-essential \
            crossbuild-essential-armhf \
            crossbuild-essential-arm64 \
            libsystemd-dev \
            libsystemd-dev:arm64 \
            libsystemd-dev:armhf \
            libgpiod-dev \
            libgpiod-dev:arm64 \
            libgpiod-dev:armhf
          
      - name: Compile AquachemD Architectures
        run: |
          make clean
          make all arm64 armhf

      - name: Create release archive
        # Preserved 'web/' alongside your compiled release binaries
        run: tar -czvf AquachemD-release.tar.gz web/ release/

      - name: Save Archive for Deployment
        uses: actions/upload-artifact@v4
        with:
          name: aquachemd-binaries
          path: AquachemD-release.tar.gz
          retention-days: 1

  deploy:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Compiled Binaries
        uses: actions/download-artifact@v4
        with:
          name: aquachemd-binaries

      - name: Update GitHub Release and Upload Artifact
        uses: softprops/action-gh-release@v2 
        with:
          tag_name: ${{ needs.build.outputs.release_tag }} 
          name: Release ${{ needs.build.outputs.release_tag }}
          draft: false
          overwrite: true
          files: AquachemD-release.tar.gz
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}