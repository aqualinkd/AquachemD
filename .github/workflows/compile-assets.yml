name: AquachemD build Workflow

on:
  push:
    branches: [ main ]
    tags:
      - 'v*.*.*'
  workflow_dispatch: # Allow manual run
    inputs:
      tag_name:
        description: 'The existing tag/release name (e.g., v0.1.0) to compile for and upload assets to.'
        type: string
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Compile Binaries
    runs-on: ubuntu-latest 
    container:
      image: debian:trixie 
      
    steps:
      # 1. Checkout the precise Git reference target
      - name: Checkout Target Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.sha || github.event.inputs.tag_name }}
      
      # 2. Set up cross-compilers inside the container
      - name: Setup build environment for ARM64 and ARMHF
        run: |
          dpkg --add-architecture armhf 
          dpkg --add-architecture arm64
          apt-get update -y
          apt-get install -y \
            build-essential \
            crossbuild-essential-armhf \
            crossbuild-essential-arm64 \
            libsystemd-dev \
            libsystemd-dev:arm64 \
            libsystemd-dev:armhf \
            libgpiod-dev \
            libgpiod-dev:arm64 \
            libgpiod-dev:armhf
          
      # 3. Compile all native and cross architectures
      - name: Compile AquachemD Architectures
        run: |
          make clean
          make all arm64 armhf

      # 4. Pack the fresh binaries into the release tarball
      - name: Create release archive
        run: tar -czvf AquachemD-release.tar.gz web/ release/

      # 5. Hand the file off to the workspace host
      - name: Save Archive for Deployment
        uses: actions/upload-artifact@v4
        with:
          name: aquachemd-binaries
          path: AquachemD-release.tar.gz
          retention-days: 1

  deploy:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Compiled Binaries
        uses: actions/download-artifact@v4
        with:
          name: aquachemd-binaries

      # 6. Post directly back to the active release matching your input target
      - name: Update GitHub Release and Upload Artifact
        uses: softprops/action-gh-release@v2 
        with:
          tag_name: ${{ github.event_name == 'push' && github.ref_name || github.event.inputs.tag_name }} 
          name: Release ${{ github.event_name == 'push' && github.ref_name || github.event.inputs.tag_name }}
          draft: false
          overwrite: true
          files: AquachemD-release.tar.gz
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}