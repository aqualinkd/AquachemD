name: Compile Release Assets

on:
  push:
    branches: [ main ]
    tags:
      - 'v*.*.*'
  workflow_dispatch: # Allows manual run fallback
    inputs:
      tag_name:
        description: 'The existing tag/release name (e.g., v0.1.0) to compile for and upload assets to.'
        type: string
        required: true
        
  # Automatically chain when the Publish Production Release workflow creation finishes
  workflow_run:
    workflows: ["Publish Production Release"]
    types:
      - completed

permissions:
  contents: write

jobs:
  build:
    name: Compile Binaries
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest 
    container:
      image: debian:trixie 
    
    outputs:
      release_tag: ${{ steps.determine_tag.outputs.tag }}
      
    steps:
      - name: Determine Target Tag
        id: determine_tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TARGET_TAG="${{ github.event.inputs.tag_name }}"
            echo "Context: Manual execution."
          elif [ "${{ github.event_name }}" = "push" ]; then
            TARGET_TAG="${{ github.ref_name }}"
            echo "Context: Direct Git push/tag event."
          else
            echo "Context: Chained from completed workflow."
            # Read the target branch/tag metadata out of the upstream context payload
            RAW_REF="${{ github.event.workflow_run.head_branch }}"
            
            # If it's a full reference path like refs/tags/v0.1.1, strip it to v0.1.1
            # If it's already just the tag v0.1.1, it remains untouched
            CLEAN_TAG=$(echo "$RAW_REF" | sed -E 's|^refs/tags/||')
            
            # Fallback check: If head_branch somehow drops back to 'main' or empty,
            # we will fetch the single latest production git tag name from the API via a basic curl
            if [ -z "$CLEAN_TAG" ] || [ "$CLEAN_TAG" = "main" ]; then
              echo "Upstream head_branch context evaluated to main/empty. Querying latest tag..."
              CLEAN_TAG=$(curl -s "https://api.github.com/repos/${{ github.repository }}/releases/latest" | grep -oP '"tag_name":\s*"\K[^"]+')
            fi
            
            TARGET_TAG="$CLEAN_TAG"
          fi
          
          echo "---------------------------------"
          echo "Workflow Event: ${{ github.event_name }}"
          echo "Determined Release Target Tag: $TARGET_TAG"
          echo "---------------------------------"
          echo "tag=$TARGET_TAG" >> $GITHUB_OUTPUT
          
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.determine_tag.outputs.tag }}
      
      - name: Setup build environment for ARM64 and ARMHF
        run: |
          dpkg --add-architecture armhf 
          dpkg --add-architecture arm64
          apt-get update -y
          apt-get install -y \
            build-essential \
            crossbuild-essential-armhf \
            crossbuild-essential-arm64 \
            libsystemd-dev \
            libsystemd-dev:arm64 \
            libsystemd-dev:armhf \
            libgpiod-dev \
            libgpiod-dev:arm64 \
            libgpiod-dev:armhf
          
      - name: Compile AquachemD Architectures
        run: |
          make clean
          make all arm64 armhf

      - name: Create release archive
        run: tar -czvf AquachemD-release.tar.gz web/ release/

      - name: Save Archive for Deployment
        uses: actions/upload-artifact@v4
        with:
          name: aquachemd-binaries
          path: AquachemD-release.tar.gz
          retention-days: 1

  deploy:
    name: Publish Assets to GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Compiled Binaries
        uses: actions/download-artifact@v4
        with:
          name: aquachemd-binaries

      - name: Update GitHub Release and Upload Artifact
        uses: softprops/action-gh-release@v2 
        with:
          tag_name: ${{ needs.build.outputs.release_tag }} 
          name: Release ${{ needs.build.outputs.release_tag }}
          draft: false
          overwrite: true
          files: AquachemD-release.tar.gz
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  