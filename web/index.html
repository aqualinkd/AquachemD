  <style>
    :root {
      --fonts: 'HelveticaNeue-Light', 'Helvetica Neue Light', 'Helvetica Neue', Helvetica, Arial, 'Lucida Grande', sans-serif;
      --tile-width: 100px;
      --tile_icon-height: 35px;
      --tile_name-height: 32px;
      --tile_name-charlimit: 12;
      --tile_name-height1line: 17px;
      --tile_status-height: 15px;
      --tile_grid-gap: 10px;
      --tile_name-lineheight: 1.2;
      /*
      // Large display will use the below values, just here for testing.
      --tile-width: 125px;
      --tile_icon-height: 45px;
      --tile_name-height: 42px;
      --tile_status-height: 15px;
      --tile_grid-gap: 20px;
      --tile_name-lineheight: 1.4;
      */
      /* These get overiden from config.js, don't edit */
      --body_background: rgb(235, 235, 235);
      --body_text: black;
      --options_pane_background: rgb(245, 245, 245);
      --options_pane_bordercolor: rgb(124, 124, 124);
      --options_slider_ball: 30;
      --options_slider_highlight: #2196F3;
      --options_slider_lowlight: #d3d3d3;
      --options_slider_height: 20px;
      --options_button_background: rgb(192, 192, 192);
      --head_background: rgb(43, 106, 143);
      --head_text: #fff;
      --error_background: rgb(143, 43, 43);
      --tile_background: rgb(220, 220, 220);
      --tile_text: rgb(110, 110, 110);
      --tile_on_background: #fff;
      --tile_on_text: #000;
      --tile_status_text: rgb(87, 87, 87);

      --value_tile_normal_color: rgb(4, 159, 248);
      /*--value_tile_attention_color:  rgb(255, 187, 0);*/
      --value_tile_attention_color: rgb(255, 160, 0);
      --value_tile_outofrange_color: rgb(255, 100, 0);

      --options_radio_ball: 20px;
      --options_radio_highlight: #2196F3;
      --options_radio_lowlight: #d3d3d3;

      --cronhelp_background: rgb(193, 193, 193);
      --csinputcell_background: rgb(255, 255, 255);

      --tile_icon_background_color_heat: rgb(255, 123, 0);
      --tile_icon_background_color_cool: rgb(4, 159, 248);
      --tile_icon_background_color_enabled: rgb(78, 196, 0);
      --tile_icon_background_color_disabled: rgb(110, 110, 110);

      --tile_off_opacity: 0.95;
    }

    div {
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    div::-moz-selection {
      background: transparent;
    }

    div::selection {
      background: transparent;
    }

    html {}

    body {
      background-color: var(--body_background);
      font-family: var(--fonts);
      font-weight: 600;
      font-size: 14px;
      color: var(--body_text);
      /*margin: 0 !important;*/
      /*padding: 0 !important;*/
      /*margin: 10px !important;*/
      /* Font rendering (mainly for firefox) */
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .body_wrap {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0px;
      left: 0px;
      background-repeat: no-repeat;
      background-position: center;
      background-size: cover;
      height: 100%;
    }

    .opaque {
      top: 0px;
      left: 0px;
      filter: opacity(60%);
      opacity: 0.6;
    }

    .vopaque {
      top: 0px;
      left: 0px;
      filter: opacity(40%);
      opacity: 0.4;
    }

    .options_pane {
      background-color: var(--options_pane_background);
      border: 2px solid var(--options_pane_bordercolor);
      border-radius: 20px;
      justify-content: center;
      align-items: center;
      width: 345px;
      top: 10px;

      /* Carful with below, it stops mouse click propagation as well. */
      display: flex;
      position: relative;
    }

    .scheduler_pane {
      background-color: var(--options_pane_background);
      border: 2px solid var(--options_pane_bordercolor);
      border-radius: 20px;
      justify-content: center;
      align-items: center;
      /*width: 650px;*/
      min-width: 660px;
      max-width: 680px;
      padding: 10px;

      /* Carful with below, it stops mouse click propagation as well. */
      display: flex;
      position: relative;
    }

    /* UNUSED: Simulator functionality not used in AquachemD */
    /*
    .scheduler_table {
      overflow-x: hidden;
      overflow-y: auto;
      width: 665px;
    }
    */

    /* UNUSED: Simulator functionality not used in AquachemD */

    .simiframe {
      width: 305px;
      height: 385px;
    }

    .options {
      top: 10px;
      /*left: 10px;*/
      position: fixed;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100vw;
      /*
      height: 100%;
      */
    }

    .wrapper {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(var(--tile-width), auto));
      grid-auto-rows: 1fr, repeat(auto-fit, minmax(var(--tile-width), auto));
      grid-gap: var(--tile_grid-gap);
      padding: 0 !important;
      margin: 10px !important;
    }

    .head {
      /*background-color: rgb(124, 124, 124);*/
      background-color: var(--head_background);
      color: var(--head_text);
      border-radius: 5px;
      padding: 5px;
      grid-column: 1 / -1;
    }

    .error {
      background-color: var(--error_background) !important;
    }

    .hide {
      display: none;
      opacity: 0.0;
      filter: opacity(0%);
    }

    .tile {
      background-color: var(--tile_background);
      color: var(--tile_text);
      border-radius: 10px;
      padding: 0px;
      /*font-size: 100%;*/
      box-sizing: border-box;
      padding: 5px;
      height: var(--tile-width);
      width: var(--tile-width);
      /*filter: opacity(90%);*/
      opacity: var(--tile_off_opacity);
    }

    .on {
      background-color: var(--tile_on_background);
      color: var(--tile_on_text);
      filter: opacity(100%);
      opacity: 1.0;
    }

    .flash {
      color: var(--tile_on_text);
      filter: opacity(90%);
      opacity: 0.9;
      -webkit-animation-name: tile-flash;
      /* Safari 4.0 - 8.0 */
      -webkit-animation-duration: 2s;
      /* Safari 4.0 - 8.0 */
      animation-name: tile-flash;
      animation-duration: 2s;
      animation-iteration-count: infinite;
    }

    /* Safari 4.0 - 8.0 */
    /*
    @-webkit-keyframes tile-flash {
      0% {
        background-color: var(--tile_on_background);
        opacity: 1.0;
      }
      50% {
        background-color: var(--tile_background);
        opacity: 0.8;
      }
      100% {
        background-color: var(--tile_on_background);
        opacity: 1.0;
      }
    }
*/
    /* Standard syntax */

    @keyframes tile-flash {
      0% {
        background-color: var(--tile_on_background);
        opacity: 1.0;
      }

      50% {
        background-color: var(--tile_background);
        opacity: 0.8;
        /* 0.9 */
      }

      100% {
        background-color: var(--tile_on_background);
        opacity: 1.0;
      }
    }

    /*
    .off {
      background-color: #ccc;
      color: rgb(133, 133, 133);
    }
*/

    .tile_icon {
      height: var(--tile_icon-height);
      display: table;
      margin: 0 auto;
      /*background-color: red;*/
    }

    .tile_name {
      height: var(--tile_name-height);

    }

    .tile_name_1line {
      height: var(--tile_name-height1line);

      line-height: var(--tile_name-lineheight);
    }

    .tile_status {
      color: var(--tile_status_text);
      height: var(--tile_status-height);
      /*background-color: blue;*/
    }

    .tile_icon_value {
      border-radius: calc(var(--tile_icon-height) / 2);
      font-weight: 600;
      /*border-radius: 27px;*/
      height: var(--tile_icon-height);
      min-width: var(--tile_icon-height);
      text-align: center;
      vertical-align: middle;
      line-height: var(--tile_icon-height);
      filter: opacity(100%);
      opacity: 1.0;
    }

    /* All for options panel */

    .option_switch {
      position: relative;
      display: inline-block;
      width: 60px;
      height: 34px
    }

    .option_switch input {
      display: none;
    }

    .option_switch_slide {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: var(--options_slider_lowlight);
      /*-webkit-transition: .4s;  */
      transition: .4s;
      border-radius: 34px;
    }

    .option_switch_slide:before {
      position: absolute;
      content: "";
      height: calc(var(--options_slider_ball)*1px);
      width: calc(var(--options_slider_ball)*1px);
      left: 2px;
      bottom: 2px;
      background-color: white;
      /*-webkit-transition: .4s;*/
      transition: .4s;
      border-radius: 50%;
    }

    input:checked+.option_switch_slide {
      background-color: var(--options_slider_highlight);
    }

    input:focus+.option_switch_slide {
      box-shadow: 0 0 1px var(--options_slider_highlight);
    }

    input:checked+.option_switch_slide:before {
      -webkit-transform: translateX(26px);
      -ms-transform: translateX(26px);
      transform: translateX(26px);
    }

    .option_slider {
      /*-webkit-appearance: none;*/
      width: 300px;
      height: var(--options_slider_height);
      background: var(--options_slider_lowlight);
      outline: none;
      -webkit-transition: .2s;
      transition: opacity .2s;
      border-radius: var(--options_slider_height);
    }

    .option_slider::-webkit-slider-thumb {
      /*-webkit-appearance: none;*/
      appearance: none;
      width: calc(var(--options_slider_ball)*1px);
      height: calc(var(--options_slider_ball)*1px);
      background: var(--options_slider_highlight);
      cursor: pointer;
      border-radius: calc(var(--options_slider_ball)*1px);
    }

    .option_slider::-moz-range-thumb {
      width: calc(var(--options_slider_ball)*1px);
      height: calc(var(--options_slider_ball)*1px);
      background: var(--options_slider_highlight);
      cursor: pointer;
      border-radius: var(--options_slider_height);
    }

    input:checked+.option_radio-value {

  border-color: #169a9a;
  box-shadow: 0 0.0625em 0 0.0625em rgba(0,0,0,0.075);*/

    .sc_table,
    .sc_table th,
    .sc_table td {
      /*border: 1px solid #ccc;*/

      padding: 0px;
    }

    .sc_tablehead {
      vertical-align: top;
      text-align: center;
    }


    .sc_tablerowhidden {
      visibility: collapse;
      line-height: 0;
    }

    .sc_tablerowhidden tr {
      visibility: hidden;
      height: 0;
      max-height: 0;
      padding: 0;

    }

    .cs_commandcell {
      background-color: var(--csinputcell_background);
      width: 60px !important;
      overflow: hidden;
      overflow: -moz-hidden-unscrollable;
      -webkit-appearance: none;

    }

    .cs_devicecell {
      background-color: var(--csinputcell_background);
      width: 150px !important;

    .cs_valuecell {

    .cs_inputcell {

  <script type='text/javascript'>
    //'use strict';
    var _DEBUG = true;

    var _aqualinkd = false;

    /* dumb increment protocol */
    var _socket_di;

    var _devices;

    var _config = {};
    var _dynamicconfig = {};

    var _aq_display_tile_size = 'small';

    var _lightProgramDropdown = false;
    var _pressEvent;
    var _ignoreMouseEvent = false;
    var _temperature_units;
    var _aqualink_data;
    var _landscape = false;
    //var _displayNames = [];
    //var _scheduler_devices_json = [];
    var _tile_line_char_limit = 0;
    var _deviceOrder = [];
    var _enable_schedules = true;
    var _theme = "";

    var _switchOnUri;
    var _switchOffUri;
    var _sensorOnUri;
    var _sensorOffUri;
    //var _targetClearErrorMsg = new Date();

    var _DisableOffIconCircle = true;

    const _isDarkMode = window.matchMedia("(prefers-color-scheme: dark)").matches;

    // The actual log function
    //const _log = (...args) => console.log(`[DEBUG ${new Date().toISOString()}]:`, ...args);
    //const _log = (...args) => console.log(`[DEBUG] `,...args);
    const _log = (...args) => {
      const stack = new Error().stack;
      if (!stack) return console.log(...args);

      const lines = stack.split('\n');
      const callerLine = lines.find(l =>
        l !== "" &&
        !l.includes('_log') &&
        !l.includes('debug') &&
        !l.includes('Error')
      );
      const match = callerLine?.match(/^([^@]*)@.*:(\d+):\d+/);
      const rawTag = match ? `${match[1] || 'anon'}():${match[2]}` : "unknown";
      const MAX_WIDTH = 25;
      let formattedTag = rawTag.length > MAX_WIDTH
        ? ".." + rawTag.slice(-(MAX_WIDTH - 2))
        : rawTag.padEnd(MAX_WIDTH, ' ');

      console.log(`[${formattedTag}]:`, ...args);
    };

    const _nothing = () => { };

    let LOG = _nothing; // No Debug

    if (_DEBUG) {
      LOG = _log; // Debug
    }

    const _DeviceAttributes = Object.freeze({
      // Switch setable states
      ON: 'set_on',
      OFF: 'set_off',
      ENABLED: 'set_enabled',
      DISABLED: 'set_disabled',

      // Switch options
      TIMER: 'timer',
      PROGRAM: 'program',
      DIMMER: 'dimmer',
      VSP: 'vsp',
      ALT_LABEL: 'alt_label',
      RESET_STATS: 'reset_stats',

      // Controller types
      HEATER: 'heater',
      SWG: 'swg',
      FREEZE: 'freeze',
      CHILLER: 'chiller',

      // Value options
      STATS: 'stats',
    });

    const _DeviceTypes = Object.freeze({
      // Basic Controls
      SWITCH: 'switch',

      // Sensors & Data
      BINARY_SENSOR: 'binary_sensor',
      VALUE: 'value',
      TEMPERATURE: 'temperature',
      SENSOR: 'sensor',
      AVERAGE: 'average', // Dynamically created from a Sensor device with Stats as attribute. 

      // Setpoints.  ie heater, SWG, freeze, chiller etc.
      CONTROLLER: 'controller',
    });

    const _DeviceStates = Object.freeze({
      OFF: '0',
      ON: '1',
      ENABLED: '2',
      DISABLED: '3',
    });

    //LOG(_isDarkMode ? "Dark mode is on" : "Light mode is on");

    async function loadConfig() {
      try {
        // Fetch the configuration file
        const response = await fetch('/config.json', { cache: 'no-store' });
        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }
        // Parse the JSON data
        _config = await response.json();

      } catch (error) {
        //console.error("Loading config failed:", error);
        console.log("Loading config failed:", error);
        displayErrorMessagee("Error Loading web config!", 5);
        //document.getElementById("header").classList.add("error");
        //_targetClearErrorMsg = new Date(Date.now() + 5000);  // Set 5 sec from now.
      }

      // Set current theme
      if (_config?.theme === "auto") {
        _theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "-dark" : "-light";
      } else if (_config?.theme) {

    function add_clickEvent(tile, id) {
      // --- TOUCH EVENTS (Tablet/Phone) ---
      tile.addEventListener('touchstart', function (e) {
        //LOG("Touch start on tile " + id);
        // 1. EARLY EXIT: If the dialog is open, do absolutely nothing.
        //if (isTileOptionsOpen()) return;

        if (e.cancelable) e.preventDefault();
        _ignoreMouseEvent = true;

        _pressEvent = window.setTimeout(function () {
          _pressEvent = 0;
          endPress(id);
        }, 1000);
      }, { passive: false });

      tile.addEventListener('touchend', function (e) {
        //LOG("Touch end on tile " + id);
        if (e.cancelable) e.preventDefault();

        if (_pressEvent != 0) {
          clearTimeout(_pressEvent);
          switchTileState(id, false);
        }
      }, { passive: false });

      // --- MOUSE EVENTS (Desktop) ---
      tile.addEventListener("mousedown", function () {
        //LOG("Mouse down on tile " + id);
        // 1. EARLY EXIT: Ignore clicks if options are open
        // 2. OR EXIT: Ignore if we just handled a touch event
        //if (isTileOptionsOpen() || _ignoreMouseEvent) return;

        _pressEvent = window.setTimeout(function () {
          _pressEvent = 0;
          endPress(id);
        }, 1000);
      });

      tile.addEventListener("mouseup", function () {
        LOG("Mouse up on tile " + id);
        if (_pressEvent != 0 && !isTileOptionsOpen()) {
          clearTimeout(_pressEvent);
          switchTileState(id, false);
        }
        // Reset the flag after the full mouse cycle finishes
        _ignoreMouseEvent = false;
      });
    }

    function cutContentTextLength(text, lines) {
      //var title1linechatlimit = getComputedStyle(document.documentElement).getPropertyValue('--tile_name-charlimit');
      // 12 or 15.
      if (countLines(text, _tile_line_char_limit - 1) > lines) {
        //LOG ("Text '"+text+"' will take 3+ lines");
        text = text.replace(/\bChemistry\b/, "Chem");
        //LOG ("new Text '"+text+"'");
      }
      return text
    }

    function countLines(text, limit = 15) {
      const words = text.split(/\s+/);  // split on spaces (multiple OK)
      let lines = 1;
      let currentLen = 0;

      for (const word of words) {
        if (word.length === 0) continue; // skip empty strings

        if (currentLen === 0) {
          // first word on the line
          currentLen = word.length;
        } else if (currentLen + 1 + word.length <= limit) {
          // add word + 1 space
          currentLen += 1 + word.length;
        } else {
          // new line
          lines++;
          currentLen = word.length;
        }
      }
      return lines;
    }

    // Reduce the number of decimal places if a float is longer than a
    // a set number of digits.  Leave any int / string alone, and ONLY reduce the decimal part of a float.

    function reduct(value) {

      const str = String(value);
      const parts = str.split('.');

      const integerDigits = parts[0].length;

      let fractionalDigits = 0;
      // If the array has more than one part, a decimal point was found.
      if (parts.length > 1) {
        fractionalDigits = parts[1].length;
      } else {
        // No decimal places, return.
        return value;
      }

      // Large tiles vs small tiles.
      let total_digits = 3;
      if (_aq_display_tile_size == "large") {
        total_digits = 5;
      }

      if (integerDigits + fractionalDigits <= total_digits) {
        // Total length is less so no change
        return value;
      } else if (integerDigits >= total_digits) {
        // Simply return the intiger and not decimal places.
        return parts[0].toString();
      } else {
        let numFractionalDigits = total_digits - integerDigits;
        return parts[0].toString() + "." + parts[1].substring(0, numFractionalDigits);
      }
      return value;
    }

              _devices.devices[id]?.attributes?.includes(_DeviceAttributes.FREEZE) ||
              _devices.devices[id]?.attributes?.includes(_DeviceAttributes.CHILLER)) {
              ext = '&deg;';
            } else if (_devices.devices[id]?.attributes?.includes(_DeviceAttributes.SWG)) {
              ext = '%';

              ext = "mV";
            } else {
              //LOG("*** No UOM for "+id+" and type "+type);
            }

          value = (value * 9/5) + 32;
          ext = "°f"; 
        }
      }

      if (_config.devices[id]?.precision !== undefined && isActuallyNumeric(value)) {
        value = value.toFixed(_config.devices[id]?.precision);
      } else if (isActuallyNumeric(value) && (type == 'sensor' || type == 'average') && id.startsWith('ORP_')) {

      const thresholds = _config?.tile_thresholds?.[id] ?? _config?.devices[id]?.thresholds ?? null;

      if (thresholds != null && thresholds) {
        if (value <= thresholds?.outofrange?.min || value >= thresholds?.outofrange?.max) {
          status = 'rangecritical';
          if (value <= thresholds.outofrange.min && thresholds.outofrange.mintext != null)
            text = thresholds.outofrange.mintext;
          else if (value >= thresholds.outofrange.max && thresholds.outofrange.maxtext != null)
            text = thresholds.outofrange.maxtext;
          else
            text = 'Out of range';
        } else if (value <= thresholds?.attention?.min || value >= thresholds?.attention?.max) {
          status = 'rangewarning';
          if (value <= thresholds.attention.min && thresholds.attention.mintext != null)
            text = thresholds.attention.mintext;
          else if (value >= thresholds.attention.max && thresholds.attention.maxtext != null)
            text = thresholds.attention.maxtext;
          else if (_tile_line_char_limit < 15)
            text = 'Attention';
          else
            text = 'Needs attention';
        }
      } else {
        //LOG("No thresholds for "+id);
      }

      //LOG("Status for "+id+" = "+status);
      setTileOn(id, status);
      if (text != '') {

      const isOff = isDeviceOff(id);

      // Display is a special status to "brighten up" sensor values. 
      if (status != "on" && status != "off" && status != "enabled" && status != "disabled" && status != "flash"

        } else { // On or Enabled

          if (status_text == status) {

    /*
/**
 * Formats seconds into a human-readable string.
 * Returns HH:MM if duration is 1 minute or more.
 * Returns MM:SS if duration is less than 1 minute.
 */
    function formatDuration(totalSeconds) {
      // UNUSED: Only called from update_status_OLD() which is deprecated.
      if (totalSeconds < 0) totalSeconds = 0;

      if (totalSeconds >= 60) {
        const roundedSeconds = Math.round(totalSeconds / 60) * 60;
        const h = Math.floor(roundedSeconds / 3600);
        const m = Math.floor((roundedSeconds % 3600) / 60);
        return `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}`;
      }

      const s = Math.floor(totalSeconds % 60);
      return `00:${s.toString().padStart(2, '0')}s`;
    }



    function padToTwoDigits(num) {
      return num.toString().padStart(2, "0");
    }

    function caseInsensitiveIndexOf(array, searchString) {
      const lowerCaseArray = array.map(element => String(element).toLowerCase());
      return lowerCaseArray.indexOf(searchString.toLowerCase());
    }

    function createTile(object) {
      //LOG("Create tile "+object.id);
      if (object.label == 'NONE') {
        //LOG("Create tile <exclude name> "+object);
        return;
      }

      // See if disply is off or missing.
      var deviceConfig = _config.devices[object.id];
      if (deviceConfig === undefined) {
        //LOG("Device "+object.id+" does not exist in config.json, creating tile");
      } else if (deviceConfig.display === false) {
        //LOG("Device "+object.id+" exists but display is disabled.");
        return;
      } else {
        //LOG("Device "+object.id+" exists and display is enabled.");
      }

      switch (object.type) {
        case _DeviceTypes.SWITCH:
        case _DeviceTypes.BINARY_SENSOR:
          var img = object.id.replace('/', '_');
          ext_type = object.type;

          if (_config?.devices && _config?.devices[object.id] && _config?.devices[object.id]?.on_icon && _config?.devices[object.id]?.off_icon) {
            add_tile(object.id, object.label, object.status, object.type, object.attributes, _config?.devices[object.id]?.off_icon, _config?.devices[object.id]?.on_icon);
          } else {
            add_tile(object.id, object.label, object.status, object.type, object.attributes);
          }
          break;
        case _DeviceTypes.VALUE:
        case _DeviceTypes.TEMPERATURE:
        case _DeviceTypes.SENSOR:
        case _DeviceTypes.AVERAGE:
          add_tile(object.id, object.label, object.status, object.type, object.attributes);
          if (object.uom !== undefined) {
            setTileUOM(object.id, object.uom);
          } else {
            if (_config.devices[object.id]?.uom) {
              //LOG("From config UOM for "+object.id+" is set to: " + _config.devices[object.id].uom);
              setTileUOM(object.id, _config.devices[object.id].uom);
            }
          }
          break;
        case _DeviceTypes.CONTROLLER:
          add_tile(object.id, object.label, object.status, object.type, object.attributes);
          document.getElementById(object.id).setAttribute('setpoint', object.spvalue);
          break;
        default:
          LOG("Unknown type '" + object.type + "' for Device " + object.label);
          break;
      }

    }


    function updateTile(device) {

      //LOG("updateTile ID: " + device.id);

      if (device.type == _DeviceTypes.SENSOR) {
        setTileOn(device.id, device.status);
        // setTileValue has to be called after since it will change the On color for outofrange 
        setTileValue(device.id, device.value, device.status);
      } else if (device.type == _DeviceTypes.SWITCH || device.type == _DeviceTypes.BINARY_SENSOR) {
        setTileOn(device.id, device.status);
      } else if (device.type == _DeviceTypes.AVERAGE) {
        setTileOn(device.id, device.status);
        setTileValue(device.id, device.value, device.status);
        setTileOnText(device.id, "Max : "+formatTileValue(device.id ,device.max));
        setTileOnTextLine2(device.id, "Min : "+formatTileValue(device.id ,device.min));
      }

    function SyncTileOptions(context = null) {

      
      const tile_options = document.getElementById('tile_options');
      let id = tile_options.getAttribute('device_id');

      const time_slider = document.getElementById('timer_slider_range');
      const time_slider_output = document.getElementById('timer_slider_text_value');
      const onoff_switch = document.getElementById('onoff_switch');
      const onoff_switch_text = document.getElementById('onoff_switch_text_value');

      let tm_ext = ' runtime (seconds)';
      if (useMinutesForRuntime(id)) {
        tm_ext = ' runtime (minutes)';
      }

      //LOG("tileOptionsSync context="+context);

      if (context === null) {
        //LOG("tileOptionsSync SETUP");
        context = document.getElementById('onoff_switch');
        if (context == null) {
          //LOG("tileOptionsSync No onoff_switch element found, skipping setup");
          return;
        }
        // Setup the initial state of the switch based on the current device status
        if (_devices.devices[id].status.toLowerCase() === 'on') {
          context.checked = true;
        } else {
          context.checked = false;
        }
        // Now let everything run as if the switch has just changed state.
      }

      if (context.id == 'onoff_switch') {
        if (onoff_switch_text) {
          onoff_switch_text.innerHTML = ((context.checked) ? "On" : "Off");
        }
        if (context.checked == false && time_slider) {
          time_slider.value = 0;
        } else if (time_slider) {
          //time_slider.value = _devices.devices[id].timer_default_runtime ?? 0;
        }
        if (time_slider_output) {
          time_slider_output.innerHTML = time_slider?.value + tm_ext;
        }
      } else if (context.id == 'timer_slider_range') {
        if (time_slider_output) {
          time_slider_output.innerHTML = context?.value + tm_ext;
        }
        if (context.value == 0 && onoff_switch && onoff_switch) {
          onoff_switch.checked = false;
          onoff_switch_text.innerHTML = ((onoff_switch?.checked) ? "On" : "Off");
        } else if (onoff_switch && onoff_switch) {
          onoff_switch.checked = true;
          onoff_switch_text.innerHTML = ((onoff_switch?.checked) ? "On" : "Off");
        };
      } else {
        LOG("tileOptionsSync unknown context " + context.id);
      }
    }

    function closeTileOptions(context = null) {
      const tile_options = document.getElementById('tile_options');
      const id = tile_options.getAttribute('device_id');
      const device = _devices.devices[id];
      const isOn = document.getElementById('onoff_switch')?.checked;
      let onTime = document.getElementById('timer_slider_range')?.value ?? 0;

      if (useMinutesForRuntime(id)) {
        onTime = onTime * 60; // Convert minutes back to seconds for the backend
      }

      LOG("closeTileOptions for '" + device.label + "' type '" + device.type + "' isOn=" + isOn + " onTime=" + onTime);

      switch (device.type) {
        case _DeviceTypes.SWITCH:
          if (device.status.toLowerCase() === 'on') {
            if (!isOn) {
              send_command(id, _DeviceStates.OFF);
            }
          } else if (device.status.toLowerCase() === 'disabled') {
            if (isOn) {
              send_command(id, _DeviceStates.ON);

    function device2english(device, name) {
      LOG("device2english "+device+" name="+name);
      

      const deviceArray = Object.values(_devices.devices);

      for (const obj of deviceArray) {
        if (device == obj.label) {
          if (name == true) {
            return obj.label;
          } else {
            switch (obj.type) {
              case _DeviceTypes.CONTROLLER:
                if (obj.attributes?.includes(_DeviceAttributes.HEATER) ||
                    obj.attributes?.includes(_DeviceAttributes.CHILLER) ||
                    obj.attributes?.includes(_DeviceAttributes.FREEZE)) {
                  return "temperature";
                } else if (obj.attributes?.includes(_DeviceAttributes.SWG)) {
                  return "percent";
                }
                break;
               case _DeviceTypes.SWITCH:
                if (obj.attributes?.includes(_DeviceAttributes.VSP)) {
                  if (obj.Pump_Type == "vfPump" && _config.tile_settings.show_vsp_gpm.toLowerCase() === "true") {
                    return "GPM";
                  } else if (commandID == V_RPM) {
                    return "RPM";
                  }
                } else if (obj.attributes?.includes(_DeviceAttributes.TIMER)) {
                  return "timer";
                /*} else if (obj.attributes?.includes(_DeviceAttributes.STATS)) {
                  return "stats";*/
                }
                break;
            }
          }
        }   
      }

      if (name == true) {
        return device;
      } else {
        return "";
      }
    }

    function cs_schedules(json) {
      if (typeof json.schedules === "undefined") {
        return
      }
      for (let i = 0; i < json.schedules.length; i++) {
        let obj = json.schedules[i];
        //LOG("Sched "+obj.url);
        var f = 0;
        var subdev = "";
        var device = "";
        for (var j = 0; j < obj.url.length; j++) {
          if (obj.url[j] == "/") {
            f++;
          } else if (f == 2) {
            device = device + obj.url[j];
          } else if (f == 3) {
            subdev = subdev + obj.url[j];
          }
        }
        // If in release we add device, use obj.id rather than device in below and remove device from above.
        cs_addschedule(obj.enabled, obj.min, obj.hour, obj.daym, obj.month, obj.dayw, device, subdev, obj.value);
      }
    }

    function cs_getExtraCommand(device, commandID) {
      LOG("cs_getExtraCommand for device "+device+" commandID="+commandID);
      const deviceArray = Object.values(_devices.devices);

      for (const obj of deviceArray) {
        if (device == obj.id) {
          switch (obj.type) {
            case _DeviceTypes.CONTROLLER:
              if (obj.attributes?.includes(_DeviceAttributes.HEATER) ||
                  obj.attributes?.includes(_DeviceAttributes.CHILLER) ||
                  obj.attributes?.includes(_DeviceAttributes.FREEZE)) {
                return "/setpoint";
              } else if (obj.attributes?.includes(_DeviceAttributes.SWG)) {
                return "/percent";
              }
              break;
            case _DeviceTypes.SWITCH:
              if (obj.attributes?.includes(_DeviceAttributes.VSP)) {
                if (commandID == V_GPM) {
                  return "/GPM";
                } else if (commandID == V_RPM) {
                  return "/RPM";
                }
              } else if (obj.attributes?.includes(_DeviceAttributes.TIMER)) {
                if (commandID == V_TIMER) {
                  return "/timer";
                }
              } else if (obj.attributes?.includes(_DeviceAttributes.RESET_STATS)) {
                if (commandID == V_RESET_STATS) {
                  return "/reset_stats";
                }
              }
              break;
          }
        }
      }
      return "/"; // Some Error if we get here, but better than nothing.
    }

    function cs_createJSON() {

      for (var r = CS_ROW_INDEX, row; row < table.rows.length - 2, row = table.rows[r]; r++) {

        month = row.querySelector('#month')?.value;
        dayw = row.querySelector('#dayw')?.value;
        device = row.querySelector('#device')?.value;
        command = row.querySelector('#command')?.value;
        value = row.querySelector('#value')?.value;
        if (min && hour && daym && month && dayw && device && command) {
          if (command >= 2) {
            command = cs_getExtraCommand(device, command);
            /*. This needs to check 1d 25h 1w etc */
            if (isNaN(value)) {
              row.querySelector('#value').classList.add("cs_error");
              document.getElementById("crontext").innerHTML = "<span class='cs_crontext'>&nbsp;<font color='red'>FIX ERROR</font>&nbsp;</span>";
              return false;
            }
          } else {
            value = command;
            command = "";
          }
          json.devices.push({
            "enabled": enabled,
            "min": min,
            "hour": hour,
            "daym": daym,
            "month": month,
            "dayw": dayw,
            "url": "/api/" + device + command + "/set",
            "value": value
          })
        }
      }
      //LOG(JSON.stringify(json));
      set_schedules(json);
      return true;
    }

    function deviceSort(a, b) {
      try {
        let pa = caseInsensitiveIndexOf(_deviceOrder, a.id);
        let pb = caseInsensitiveIndexOf(_deviceOrder, b.id);

        // Convert -1 (not found) to a high number to move to the end
        var sortA = (pa === -1) ? Infinity : pa;
        var sortB = (pb === -1) ? Infinity : pb;

        if (sortA > sortB) return 1;
        if (sortA < sortB) return -1;

      } catch (e) {
        console.log("sort exception " + e);
      }
      return 0; // If both are Infinity, they stay in their original JSON order
    }

    function check_devices(data) {
        if (data.display_message)
          displayMessage(formatSatus(data.display_message));
        else
          displayMessage("");

        if (data.time && data.date) {
          var el = document.getElementById("datetime");
          if (_landscape) {
            el.innerHTML = data.time.toLowerCase().replace(" ", "&nbsp;") + ((_landscape) ? "&nbsp;" : "<br>") + data.date.toLowerCase().replace(" ", "&nbsp;");
          } else {
            el.innerHTML = data.time.toLowerCase().replace(" ", "&nbsp;");
          }
        }

        // --- STEP 1: MUTATE DATA POOL ---
        const physicalDeviceIds = Object.keys(data.devices);

        physicalDeviceIds.forEach(id => {
          const device = data.devices[id];
          device.status = device.status.toLowerCase();

          if (device.attributes?.includes("stats")) {
            const statsId = `${id}_stats`;

            if (!data.devices[statsId]) {
              data.devices[statsId] = {
                id: statsId,
                //label: `Average ${device.label} ${device.stats?.duration}`,
                //label: `Average ${device.label}${device.stats?.duration ? ` (${device.stats.duration})` : ''}`,
                label: `Avg ${device.label}${device.stats?.duration ? `/${device.stats.duration}` : ''}`,
                status: device.status,

                avg: device.stats?.avg || 0,
                max: device.stats?.max || 0,
                min: device.stats?.min || 0,
                duration: device.stats?.duration || 0,
              };
            }
          }
        });

        _devices = data;

        // --- STEP 3: RENDER LAYER ---
        var deviceArray = Object.values(data.devices);
        deviceArray.sort(deviceSort);

        deviceArray.forEach(device => {
          device.status = device.status.toLowerCase();

          if (document.getElementById(device.id) == null) {
            createTile(device);
          }
          updateTile(device);
        });

        return data;
      }

    function get_appropriate_ws_url() {
      var pcol;
      var u = document.URL;
      /*
       * We open the websocket encrypted if this page came on an
       * https:// url itself, otherwise unencrypted
       */
      if (u.substring(0, 5) == "https") {
        pcol = "wss://";
        u = u.substr(8);
      } else {
        pcol = "ws://";
        if (u.substring(0, 4) == "http")
          u = u.substr(7);
      }
      u = u.split('/');
      //alert (pcol + u[0] + ":6500");
      return pcol + u[0];
    }

  function startWebsockets() {
    // Cleanup: Always close existing socket and clear intervals before starting a new one
    if (_socket_di) {
      _socket_di.onopen = _socket_di.onmessage = _socket_di.onclose = null;
      _socket_di.close();
    }
    if (window.devicesInterval) {
      clearInterval(window.devicesInterval);
      window.devicesInterval = null;
    }

    _socket_di = new WebSocket(get_appropriate_ws_url());

    // Connection Timeout: If it doesn't open in 5s, kill it and retry
    const connTimeout = setTimeout(() => {
      if (_socket_di.readyState !== WebSocket.OPEN) {
        LOG("Connection handshake timed out. Retrying...");
        _socket_di.close(); // This will trigger onclose logic
      }
    }, 5000);

    _socket_di.onopen = function () {
      clearTimeout(connTimeout); // Handshake succeeded
      LOG("WebSocket Connected");
      get_devices();

      if (!window.devicesInterval) {
        window.devicesInterval = setInterval(() => { get_devices(); }, 60000);
      }
    };

    _socket_di.onmessage = function (msg) {
      document.getElementById("header").classList.remove("error");
      try {
        const data = JSON.parse(msg.data);
        if (data.type === 'devices') {
          _devices = check_devices(data);
          resetBackgroundSize();
        } else if (data.type === 'schedules') {
          cs_schedules(data);
        }
      } catch (e) {
        LOG("JSON Parse Error: " + e);
      }
    };

    _socket_di.onclose = function (event) { // Pass 'event' here!
      clearTimeout(connTimeout);

      // Cleanup interval so we don't stack them
      if (window.devicesInterval) {
        clearInterval(window.devicesInterval);
        window.devicesInterval = null;
      }

      LOG(`WebSocket Closed. Code: ${event.code}, Reason: ${event.reason}`);

      setElementHTML("message", ' Connection error! ');
      document.getElementById("header").classList.add("error");

      // Prevent Rapid Reconnection: 
      // If browser is throttling, a 5s delay is good, but 
      // make sure we don't have multiple timers running.
      if (window.reconnectTimer) clearTimeout(window.reconnectTimer);
      window.reconnectTimer = setTimeout(() => {
        startWebsockets();
      }, 5000);
    };

    _socket_di.onerror = function (err) {
      LOG("WebSocket Error observed");
      // Don't call startWebsockets here, onclose will handle it.
    };
  }

    function cs_synchronizeTableWidths() {


      //LOG("SET table");

      const sourceTable = document.getElementById('cronschedules');
      const destinationTable = document.getElementById('cronschedules-main');

      if (!sourceTable || !destinationTable) {
        console.error("Source or destination table not found.");
        return;
      }

      // Optional: Force tables to obey set widths for consistency
      //sourceTable.style.tableLayout = 'fixed';
      //destinationTable.style.tableLayout = 'fixed';

      const sourceCells = sourceTable.rows[0]?.cells;
      const destinationCells = destinationTable.rows[0]?.cells;

      if (!sourceCells || !destinationCells) {
        console.error("Could not find the first row/cells in one of the tables.");
        return;
      }

      //if (sourceCells.length !== destinationCells.length) {
      if (sourceCells.length > destinationCells.length) {
        console.error(`Width sync failed: Source has ${sourceCells.length} cells in the first row, Destination has ${destinationCells.length}.`);
        return;
      }

      //let total=0;
      // Iterate over the columns and apply the width
      for (let i = 0; i < sourceCells.length; i++) {
        // Get the computed width of the source cell
        //const width = sourceCells[i].offsetWidth + 'px';
        //total += sourceCells[i].getBoundingClientRect().width;
        const width = sourceCells[i].getBoundingClientRect().width + 'px';

        // Apply the exact width to the destination cell's style
        // Setting min/max width helps ensure the browser obeys the instruction
        destinationCells[i].style.minWidth = width;
        destinationCells[i].style.maxWidth = width;
        destinationCells[i].style.width = width;
      }
    }
